<!doctype html>

<head>

<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2230;--mute:#6b7385;--line:#e3e6ec;--accent:#2f6fed;--ok:#1f9d55;--warn:#d9822b;--bad:#d64545}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2030;--ink:#e8ebf2;--mute:#9aa3b8;--line:#2b3247;--accent:#6b9bff;--ok:#43c47a;--warn:#e8a04d;--bad:#ef6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px}.stat span{color:var(--mute);font-size:12px}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.ok i{background:var(--ok)}
nav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
button,select,input[type=search],input[type=date]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.panel h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.item{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item input{margin-top:4px;width:18px;height:18px;flex:none}
.item .t{font-weight:600}.item.done .t{text-decoration:line-through;color:var(--mute);font-weight:400}
.item .s{color:var(--mute);font-size:12.5px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--mute);margin-left:6px}
.late{color:var(--bad)}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.wk{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.wk.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wk small{color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.mute{color:var(--mute)}
.cal{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
.cal i{width:11px;height:11px;border-radius:3px;background:var(--line)}
.cal i.a{background:#9cc7a9}.cal i.b{background:var(--ok)}
@media(max-width:520px){.wrap{padding:12px}}
</style>
</head>

</nav>

// word: [seq,week,day,date,text,level,theme,example,phase,weekTheme]  chunk: [seq,week,day,date,text,function,phase]
const KEY='germanVocabTracker.v1';
let state={done:{}}; // id -> ISO date completed
try{const s=localStorage.getItem(KEY); if(s) state=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const ISO=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const todayISO=ISO(new Date());
const items=[...WORDS.map(w=>({id:'w'+w[0],kind:'word',week:w[1],day:w[2],date:w[3],text:w[4],sub:[w[5],w[6]].filter(Boolean).join(' · '),ex:w[7],phase:w[8],wt:w[9]})),
             ...CHUNKS.map(c=>({id:'c'+c[0],kind:'chunk',week:c[1],day:c[2],date:c[3],text:c[4],sub:c[5],ex:'',phase:c[6],wt:''}))];
const dates=[...new Set(items.map(i=>i.date))].sort();
const weeks=[...new Set(items.map(i=>i.week))].sort((a,b)=>a-b);
const clamp=d=>d<dates[0]?dates[0]:d>dates[dates.length-1]?dates[dates.length-1]:d;
let view='today', selDate=clamp(todayISO), openWeek=null, filt={kind:'',week:'',status:'',q:''};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isDone=i=>!!state.done[i.id];
const pct=(a,b)=>b?Math.round(100*a/b):0;
const bar=(a,b,ok)=>`<div class="bar ${ok?'ok':''}"><i style="width:${pct(a,b)}%"></i></div>`;
function toggle(id){ if(state.done[id]) delete state.done[id]; else state.done[id]=todayISO; save(); render(); }
function setMany(list,v){ list.forEach(i=>{ if(v) state.done[i.id]=state.done[i.id]||todayISO; else delete state.done[i.id]; }); save(); render(); }
function streak(){ const days=new Set(Object.values(state.done)); let n=0,d=new Date(); if(!days.has(ISO(d))) d.setDate(d.getDate()-1);
  while(days.has(ISO(d))){n++;d.setDate(d.getDate()-1)} return n; }
function stats(){
  const dw=items.filter(i=>i.kind==='word'&&isDone(i)).length, tw=WORDS.length;
  const dc=items.filter(i=>i.kind==='chunk'&&isDone(i)).length, tc=CHUNKS.length;
  const due=items.filter(i=>i.date<=todayISO), late=due.filter(i=>!isDone(i)).length;
  const doneToday=Object.values(state.done).filter(d=>d===todayISO).length;
  document.getElementById('stats').innerHTML=
   `<div class="stat"><b>${dw}<span> / ${tw}</span></b><span>words learned</span>${bar(dw,tw)}</div>
    <div class="stat"><b>${dc}<span> / ${tc}</span></b><span>chunks learned</span>${bar(dc,tc)}</div>
    <div class="stat"><b>${doneToday}</b><span>cards done today (goal 15)</span>${bar(Math.min(doneToday,15),15,true)}</div>
    <div class="stat"><b>${streak()}</b><span>day streak</span></div>
    <div class="stat"><b class="${late?'late':''}">${late}</b><span>overdue vs. plan</span></div>`;
}
function itemHTML(i,showDate){
  const late=!isDone(i)&&i.date<todayISO;
  return `<label class="item ${isDone(i)?'done':''}"><input type="checkbox" ${isDone(i)?'checked':''} onchange="toggle('${i.id}')">
   <div><span class="t">${esc(i.text)}</span><span class="tag">${i.kind}</span>${showDate?`<span class="tag ${late?'late':''}">${i.date}</span>`:''}
   <div class="s">${esc(i.sub)}${i.ex?` — <i>${esc(i.ex)}</i>`:''}</div></div></label>`;
}
function vToday(){
  const idx=dates.indexOf(selDate), day=items.filter(i=>i.date===selDate);
  const w=day.filter(i=>i.kind==='word'), c=day.filter(i=>i.kind==='chunk');
  const wk=day[0]?day[0].week:'', wt=(day.find(i=>i.wt)||{}).wt||'';
  const overdue=items.filter(i=>i.date<todayISO&&!isDone(i)).slice(0,15);
  let h=`<div class="row"><button onclick="step(-1)" ${idx<=0?'disabled':''}>←</button>
   <input type="date" value="${selDate}" min="${dates[0]}" max="${dates[dates.length-1]}" onchange="selDate=clamp(this.value||selDate);render()">
   <button onclick="step(1)" ${idx>=dates.length-1?'disabled':''}>→</button>
   <button onclick="selDate=clamp(todayISO);render()">Today</button>
   <span class="mute">Week ${wk}${wt?' · '+esc(wt):''}${day.length?'':' · no cards (rest/exam day)'}</span></div>`;
  if(day.length){
    h+=`<div class="panel"><h2>Words (${w.filter(isDone).length}/${w.length}) <span><button onclick='setMany(${JSON.stringify(w.map(x=>x.id))}.map(id=>items.find(i=>i.id===id)),true)'>All done</button></span></h2>${w.map(i=>itemHTML(i)).join('')}</div>`;
    h+=`<div class="panel"><h2>Chunks (${c.filter(isDone).length}/${c.length}) <span><button onclick='setMany(${JSON.stringify(c.map(x=>x.id))}.map(id=>items.find(i=>i.id===id)),true)'>All done</button></span></h2>${c.map(i=>itemHTML(i)).join('')}</div>`;
  }
  if(overdue.length) h+=`<div class="panel"><h2 class="late">Catch up — oldest unfinished cards</h2>${overdue.map(i=>itemHTML(i,true)).join('')}</div>`;
  return h;
}
function step(n){const i=dates.indexOf(selDate)+n; if(dates[i]){selDate=dates[i];render()}}
function vWeeks(){
  const cur=(items.find(i=>i.date===clamp(todayISO))||{}).week;
  let h='<div class="weeks">'+weeks.map(w=>{
    const l=items.filter(i=>i.week===w), d=l.filter(isDone).length, f=l[0];
    return `<div class="wk ${w===cur?'cur':''}" onclick="openWeek=${openWeek===w?'null':w};render()"><b>Week ${w}</b> <small>${f.phase}</small>
     <div><small>${esc((l.find(i=>i.wt)||{}).wt||'')}</small></div><small>${d}/${l.length} · ${f.date.slice(5)}</small>${bar(d,l.length,d===l.length)}</div>`}).join('')+'</div>';
  if(openWeek){
    const l=items.filter(i=>i.week===openWeek);
    h+=`<div class="panel" style="margin-top:12px"><h2>Week ${openWeek} <span><button onclick='setMany(items.filter(i=>i.week==${openWeek}),true)'>Mark all done</button> <button onclick='setMany(items.filter(i=>i.week==${openWeek}),false)'>Reset</button></span></h2>${l.map(i=>itemHTML(i,true)).join('')}</div>`;
  }
  return h;
}
function vAll(){
  const q=filt.q.toLowerCase();
  const l=items.filter(i=>(!filt.kind||i.kind===filt.kind)&&(!filt.week||i.week==filt.week)
    &&(!filt.status||(filt.status==='done')===isDone(i))&&(!q||(i.text+' '+i.sub+' '+i.ex).toLowerCase().includes(q)));
  return `<div class="row"><input type="search" placeholder="Search…" value="${esc(filt.q)}" oninput="filt.q=this.value;renderList()" id="q">
   <select onchange="filt.kind=this.value;renderList()"><option value="">Words+chunks</option><option value="word" ${filt.kind=='word'?'selected':''}>Words</option><option value="chunk" ${filt.kind=='chunk'?'selected':''}>Chunks</option></select>
   <select onchange="filt.week=this.value;renderList()"><option value="">All weeks</option>${weeks.map(w=>`<option ${filt.week==w?'selected':''}>${w}</option>`).join('')}</select>
   <select onchange="filt.status=this.value;renderList()"><option value="">Any status</option><option value="done" ${filt.status=='done'?'selected':''}>Done</option><option value="todo" ${filt.status=='todo'?'selected':''}>To do</option></select></div>
   <div class="panel" id="list"></div>`;
}
function renderList(){
  const q=filt.q.toLowerCase();
  const l=items.filter(i=>(!filt.kind||i.kind===filt.kind)&&(!filt.week||i.week==filt.week)
    &&(!filt.status||(filt.status==='done')===isDone(i))&&(!q||(i.text+' '+i.sub+' '+i.ex).toLowerCase().includes(q)));
  document.getElementById('list').innerHTML=`<h2>${l.length} cards${l.length>300?' (showing first 300)':''}</h2>`+l.slice(0,300).map(i=>itemHTML(i,true)).join('');
}
function vData(){
  return `<div class="panel"><h2>Backup / move to another device</h2>
   <p class="mute">Progress is stored in this browser only. Export it to keep a copy or open the tracker on another device.</p>
   <div class="row"><button onclick="exportData()">Export progress (.json)</button>
   <label><button onclick="this.nextElementSibling.click()">Import progress…</button><input type="file" accept=".json" hidden onchange="importData(this.files[0])"></label>
   <button onclick="if(confirm('Delete ALL progress?')){state={done:{}};save();render()}">Reset everything</button></div></div>`;
}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='vocab-progress-'+todayISO+'.json';a.click()}
function importData(f){if(!f)return;f.text().then(t=>{try{const s=JSON.parse(t);if(s&&s.done){state=s;save();render()}else alert('Not a progress file')}catch(e){alert('Invalid file')}})}
function render(){
  stats();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  document.getElementById('view').innerHTML={today:vToday,weeks:vWeeks,all:vAll,data:vData}[view]();
  if(view==='all') renderList();
}
document.getElementById('nav').onclick=e=>{const v=e.target.dataset.v;if(v){view=v;render()}};
render();
</script>
</body>
